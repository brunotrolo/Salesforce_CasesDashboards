[pytest]
testpaths = services/api-gateway/tests tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = --tb=short -v
# Ignore test collection errors from services with unmet dependencies
norecursedirs = auth-service cache-service data-service logging-service mcp-client report-service shared

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    asyncio: Async tests
