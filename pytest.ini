[pytest]
testpaths = services/api-gateway/tests services/auth-service/tests services/mcp-client/tests services/report-service/tests tests/integration
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = --tb=short

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    asyncio: Async tests
