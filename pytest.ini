[pytest]
testpaths = services/api-gateway/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = --tb=short -v
# Only collect tests from api-gateway, skip all other services
norecursedirs = services/auth-service services/cache-service services/data-service services/logging-service services/mcp-client services/report-service services/shared

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    asyncio: Async tests
