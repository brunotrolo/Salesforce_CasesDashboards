name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker build -t salesforce-reports:latest .
          docker build -t salesforce-reports-frontend:latest frontends/

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f infra/kubernetes/

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/report-service
          kubectl rollout status deployment/dashboard-fe
