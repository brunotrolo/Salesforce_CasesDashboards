name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Python dependencies
        run: |
          python --version
          pip --version
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt --verbose
          pip list | grep -E "pytest|coverage|fastapi"

      - name: Install Node dependencies
        run: |
          npm install --prefix frontends/dashboard-fe || true
          npm install --prefix frontends/builder-fe || true
          npm install --prefix frontends/analytics-fe || true

      - name: Test app import
        run: |
          cd services/api-gateway
          python -c "from src.main import app; print('App imported successfully')"

      - name: Collect tests
        run: pytest --collect-only -v

      - name: Run Python tests
        run: pytest -v --cov=services/api-gateway --cov-report=xml

      - name: Run Frontend tests
        run: |
          npm test --prefix frontends/dashboard-fe || true
          npm test --prefix frontends/builder-fe || true
          npm test --prefix frontends/analytics-fe || true

      - name: Lint Python
        run: pylint services/ || true

      - name: Lint Frontend
        run: |
          npm run lint --prefix frontends/dashboard-fe || true
          npm run lint --prefix frontends/builder-fe || true
          npm run lint --prefix frontends/analytics-fe || true

      - name: Upload coverage
        continue-on-error: true
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
