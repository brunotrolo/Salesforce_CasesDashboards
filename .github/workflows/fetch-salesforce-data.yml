name: Fetch Salesforce Data

on:
  schedule:
    - cron: '0 * * * *'  # A cada 1 hora
  workflow_dispatch:      # Manual trigger

jobs:
  sync-salesforce:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Salesforce Data
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          SF_REFRESH_TOKEN: ${{ secrets.SF_REFRESH_TOKEN }}
        run: |
          python scripts/salesforce-sync.py

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Salesforce Sync Bot"
          git add docs/data/
          git commit -m "chore: sync salesforce data $(date -u +'%Y-%m-%d %H:%M:%S')" || true
          git push
