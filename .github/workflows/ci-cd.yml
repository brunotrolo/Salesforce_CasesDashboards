name: CI/CD Pipeline

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: brunotrolo/salesforce-api-gateway
  DASHBOARD_IMAGE_NAME: brunotrolo/salesforce-dashboard-fe

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth-service, report-service, mcp-client, logging-service]

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.service }}-${{ hashFiles(format('services/{0}/requirements.txt', matrix.service)) }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        env:
          JWT_SECRET_KEY: ci-test-secret
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ci-test-password
          ENABLE_DEMO_MODE: "false"
          SF_CLIENT_ID: ci-client-id
          SF_CLIENT_SECRET: ci-client-secret
        run: python -m pytest tests/ -q

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [dashboard-fe, builder-fe, analytics-fe]

    defaults:
      run:
        working-directory: frontends/${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontends/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test

      - name: Build frontend
        run: npm run build

  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: test-backend
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API Gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/api-gateway/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:buildcache,mode=max

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: test-frontend
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Dashboard Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontends/dashboard-fe
          file: ./frontends/dashboard-fe/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.DASHBOARD_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.DASHBOARD_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.DASHBOARD_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.DASHBOARD_IMAGE_NAME }}:buildcache,mode=max