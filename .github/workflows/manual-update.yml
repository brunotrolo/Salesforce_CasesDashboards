name: Atualização Manual

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-all:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt

      - name: Buscar dados do Salesforce
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          SF_REFRESH_TOKEN: ${{ secrets.SF_REFRESH_TOKEN }}
        run: |
          python scripts/salesforce-sync.py

      - name: Gerar dashboards diário e semanal
        run: |
          python scripts/generate_dashboard.py both

      - name: Confirmar arquivos gerados
        run: |
          ls -lh docs/data/*.json
          ls -lh docs/dashboard*.html

      - name: Commit e push
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"
          git add docs/data/ docs/dashboard.html docs/dashboard-weekly.html docs/index.html
          if git diff --cached --quiet; then
            echo "Nenhuma mudança para commitar."
          else
            git commit -m "chore: manual update $(date -u +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
