apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
  namespace: salesforce-reports
  labels:
    app: report-service
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: report-service
  template:
    metadata:
      labels:
        app: report-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: report-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: report-service
        image: salesforce-reports/report-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: report-service-config
              key: log_level
        - name: CACHE_TTL_MINUTES
          valueFrom:
            configMapKeyRef:
              name: report-service-config
              key: cache_ttl_minutes
        - name: MAX_REPORTS
          valueFrom:
            configMapKeyRef:
              name: report-service-config
              key: max_reports
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: report-service-secrets
              key: redis_url
        - name: SALESFORCE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: report-service-secrets
              key: salesforce_client_id
        - name: SALESFORCE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: report-service-secrets
              key: salesforce_client_secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: config
          mountPath: /etc/config
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: report-service-config
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - report-service
              topologyKey: kubernetes.io/hostname
