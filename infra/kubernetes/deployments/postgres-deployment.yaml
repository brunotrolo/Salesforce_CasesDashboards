apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: salesforce-reports
type: Opaque
stringData:
  postgres-user: reports_user
  postgres-password: reports_secure_password_change_in_production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: salesforce-reports
data:
  init.sql: |
    -- Create extensions
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "pg_stat_statements";

    -- Create reports table
    CREATE TABLE IF NOT EXISTS reports (
      id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
      name VARCHAR(255) NOT NULL,
      report_type VARCHAR(50) NOT NULL,
      object_type VARCHAR(100) NOT NULL,
      fields JSONB NOT NULL,
      metadata JSONB,
      status VARCHAR(50) DEFAULT 'ACTIVE',
      created_by UUID NOT NULL,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      deleted_at TIMESTAMP
    );

    -- Create indexes
    CREATE INDEX idx_reports_status ON reports(status);
    CREATE INDEX idx_reports_created_by ON reports(created_by);
    CREATE INDEX idx_reports_created_at ON reports(created_at);
    CREATE INDEX idx_reports_deleted_at ON reports(deleted_at) WHERE deleted_at IS NULL;

    -- Create report executions table
    CREATE TABLE IF NOT EXISTS report_executions (
      id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
      report_id UUID NOT NULL REFERENCES reports(id),
      status VARCHAR(50) NOT NULL,
      rows_returned INTEGER,
      execution_time_ms INTEGER,
      executed_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      error_message TEXT,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX idx_executions_report_id ON report_executions(report_id);
    CREATE INDEX idx_executions_status ON report_executions(status);
    CREATE INDEX idx_executions_executed_at ON report_executions(executed_at);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: salesforce-reports
  labels:
    app: postgres
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tier: database
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: reports_db
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: postgres-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U reports_user
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U reports_user
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: postgres-init
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: postgres-data
        emptyDir: {}
      - name: postgres-init
        configMap:
          name: postgres-config
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: salesforce-reports
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
