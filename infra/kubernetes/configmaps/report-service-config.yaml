apiVersion: v1
kind: ConfigMap
metadata:
  name: report-service-config
  namespace: salesforce-reports
data:
  log_level: "INFO"
  cache_ttl_minutes: "60"
  max_reports: "10000"
  worker_threads: "4"
  request_timeout_seconds: "30"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-fe-config
  namespace: salesforce-reports
data:
  api_url: "http://api-gateway:3000"
  log_level: "warn"
  environment: "production"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-config
  namespace: salesforce-reports
data:
  prometheus_scrape_interval: "15s"
  metrics_retention_days: "30"
  grafana_admin_user: "admin"
