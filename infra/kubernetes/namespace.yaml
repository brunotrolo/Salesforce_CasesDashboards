apiVersion: v1
kind: Namespace
metadata:
  name: salesforce-reports
  labels:
    app: salesforce-reports
    environment: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: salesforce-quota
  namespace: salesforce-reports
spec:
  hard:
    requests.cpu: "10"
    requests.memory: "20Gi"
    limits.cpu: "20"
    limits.memory: "40Gi"
    pods: "100"
    services: "20"
---
apiVersion: v1
kind: NetworkPolicy
metadata:
  name: salesforce-network-policy
  namespace: salesforce-reports
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: salesforce-reports
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: salesforce-reports
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
